plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_min_version,
            fabric_api_version   : fabric_api_min_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_url              : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
    // Forge finds its SRG names through the refmap the mixin config names; Loom remaps the mixins in the jar itself
    // and writes none, so the Fabric jar leaves the line out.
    filesMatching('diegesis.mixins.json') {
        filter { String line -> line.contains('"refmap"') ? null : line }
    }
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Fabric)"
    modLoaders.add('fabric')

    curseforge {
        curseforge_requires_fabric.split(',')*.trim().findAll().each { requires(it) }
    }
}
