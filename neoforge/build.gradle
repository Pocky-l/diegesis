plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: in run/ it would share the folder with the dev client.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Local test driver (src/devtools, not in the repository): run `shots` with job.txt in run-shots/ naming a script
// in tools/shots/; it plays the script in a flat creative world and saves screenshots.
if (file('src/devtools').isDirectory()) {
    sourceSets {
        devtools {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    neoForge.addModdingDependenciesTo(sourceSets.devtools)
    neoForge.mods.register('diegesis_devtools') { sourceSet(sourceSets.devtools) }
    neoForge.runs.register('shots') {
        client()
        sourceSet = sourceSets.devtools
        gameDirectory = project.file('run-shots')
        systemProperty 'diegesis.shots', rootProject.file('tools/shots').absolutePath
        programArguments.addAll('--width', '1280', '--height', '720')
    }
}

// Sable (the physics of Create Aeronautics' ships): its companion API, bundled by Sable, only to compile against.
dependencies {
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (NeoForge)"
    modLoaders.add('neoforge')

    curseforge {
        curseforge_requires.split(',')*.trim().findAll().each { requires(it) }
    }
}
