pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'diegesis'

// common: the API and its implementation, compiled against vanilla Minecraft; forge / fabric: the loader glue. Each
// loader project compiles the common sources into its own jar.
include 'common', 'forge', 'fabric'
