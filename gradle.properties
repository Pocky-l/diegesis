org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
# The NeoForge of the playtest-26.3 client: a jar requires at least the NeoForge it was built with.
neo_version=26.3.0.84
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
# Minecraft 26.x ships unobfuscated: no Parchment mappings.
neo_form_version=26.3-1
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.5
fabric_api_version=0.166.2+26.3
fabric_api_min_version=0.166.2

## Mod
mod_id=diegesis
mod_name=Diegesis
mod_version=1.0.0-beta.19.1
mod_group_id=com.pockyl.diegesis
mod_license=MIT
mod_authors=Pocky
mod_description=Library for in-world block interfaces: the camera moves to the block and players work with its 3D parts directly, without a GUI.
mod_url=https://github.com/Pocky-l/diegesis

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1790227
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=
curseforge_optional=
curseforge_requires_fabric=fabric-api
modrinth_requires_fabric=fabric-api
